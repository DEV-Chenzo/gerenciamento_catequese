services:
  postgres:
    image: postgres:16-alpine
    container_name: catequese-postgres
    environment:
      POSTGRES_USER: catequese
      POSTGRES_PASSWORD: catequese
      POSTGRES_DB: catequese
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catequese -d catequese"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:

